<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">

<title>Perros Cuerna</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: a vet "cartilla" — dog tabs on top, a due-soon strip, then vaccine and antiparasite ledgers */
:root{
  --bg:#c8f2e0; --bg2:#bfe3fb; --spot:rgba(255,255,255,.6); --paper:#fbfefd; --ink:#1d2a2e; --muted:#566a70; --line:#d3e6e8;
  --accent:#2f6b57; --accent-ink:#ffffff; --accent-soft:#dcebe3;
  --warn:#9a6300; --warn-bg:#fbeccd; --bad:#a3302a; --bad-bg:#f8dcd8; --ok:#2f6b57; --ok-bg:#dcebe3;
  --dog-0:#2b5fb4; --dog-1:#8a3fb0; --dog-2:#b3406e; --dog-3:#1f7f8c; --dog-4:#8a5a14;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --dog-0:#8db4f5; --dog-1:#cf9bec; --dog-2:#f29bbd; --dog-3:#7fd1dc; --dog-4:#e0b172; --bg:#0f2a2a; --bg2:#10223d; --spot:rgba(255,255,255,.05); --paper:#18333a; --ink:#e8f4f3; --muted:#9fb9bd; --line:#2a4a52;
  --accent:#7cc3a6; --accent-ink:#10201a; --accent-soft:#233a31;
  --warn:#f0bf62; --warn-bg:#3a2e14; --bad:#f09a90; --bad-bg:#3d1f1c; --ok:#7cc3a6; --ok-bg:#233a31; color-scheme:dark}}
:root[data-theme="dark"]{
  --dog-0:#8db4f5; --dog-1:#cf9bec; --dog-2:#f29bbd; --dog-3:#7fd1dc; --dog-4:#e0b172; --bg:#0f2a2a; --bg2:#10223d; --spot:rgba(255,255,255,.05); --paper:#18333a; --ink:#e8f4f3; --muted:#9fb9bd; --line:#2a4a52;
  --accent:#7cc3a6; --accent-ink:#10201a; --accent-soft:#233a31;
  --warn:#f0bf62; --warn-bg:#3a2e14; --bad:#f09a90; --bad-bg:#3d1f1c; --ok:#7cc3a6; --ok-bg:#233a31; color-scheme:dark}
*{box-sizing:border-box}
body{background-color:var(--bg);background-image:radial-gradient(var(--spot) 2.5px, transparent 3px),linear-gradient(160deg,var(--bg) 0%,var(--bg2) 100%);background-size:26px 26px,100% 100%;background-attachment:fixed;min-height:100vh;color:var(--ink);font:15px/1.5 var(--body);padding:24px 16px 64px}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:clamp(26px,5vw,36px);font-weight:700;letter-spacing:-.01em}
h2{font-size:20px;font-weight:700}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.mono,.date{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px}
.code-backdrop{position:fixed;inset:0;background:rgba(10,20,25,.45);display:grid;place-items:center;padding:16px;z-index:50}
.code-box{width:100%;max-width:380px;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.code-err{color:var(--bad);font-size:13px;font-weight:700;margin:0}
.header-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--paper)}
.lang button{border:0;border-radius:999px;padding:5px 12px;font:700 13px var(--body);background:transparent;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.sub{color:var(--muted);margin:4px 0 0}
button,.btn{font:700 14px var(--body);border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:8px 14px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ghost{background:transparent;border-color:transparent;color:var(--accent);padding:6px 8px}
.danger{color:var(--bad)}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{border-radius:999px;padding:8px 16px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.profile{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.profile-text{min-width:0;display:flex;flex-direction:column;gap:4px}
.profile-text h2{font-size:24px}
.avatar{width:96px;height:96px;border-radius:50%;overflow:hidden;background:var(--accent-soft);border:3px solid var(--paper);box-shadow:0 0 0 1px var(--line);flex:none;display:grid;place-items:center;font:700 34px var(--display);color:var(--accent)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.dogname{font-weight:700}
.tab .swatch{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.dogline{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:14px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px}
.panel-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.pill{display:inline-block;font:700 12px var(--body);padding:3px 10px;border-radius:999px;white-space:nowrap}
.s-overdue{background:var(--bad-bg);color:var(--bad)}
.s-soon{background:var(--warn-bg);color:var(--warn)}
.s-ok{background:var(--ok-bg);color:var(--ok)}
.s-once{background:var(--line);color:var(--muted)}
.groups{display:flex;flex-direction:column;gap:18px}
.group{display:flex;flex-direction:column;gap:4px}
.group-head{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.dot.s-overdue{background:var(--bad)}.dot.s-soon{background:var(--warn)}.dot.s-ok{background:var(--ok)}
.count{font:500 12px var(--mono);color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:0 8px}
.upcoming{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.upcoming li{display:grid;grid-template-columns:110px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.upcoming li:first-child{border-top:0}
.upcoming .what{min-width:0}
.upcoming .what b{display:block}
.upcoming .what span{color:var(--muted);font-size:13px}
.row-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td .note{color:var(--muted);font-size:13px}
details.hist summary{cursor:pointer;color:var(--accent);font-size:13px}
details.hist ul{margin:6px 0 0;padding-left:18px;color:var(--muted);font-size:13px}
.empty{color:var(--muted);padding:8px 0}
form.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}
input,select,textarea{font:15px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.full{grid-column:1/-1}
.form-actions{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:13px var(--body);padding:5px 10px;border-radius:999px;background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.status{font-size:13px;color:var(--muted);min-height:1.2em}
.banner{background:var(--warn-bg);color:var(--ink);border-radius:10px;padding:12px 14px;font-size:14px}
.foot{color:var(--muted);font-size:13px}
@media (max-width:520px){
  .upcoming li{grid-template-columns:1fr;gap:6px}
  .row-actions{justify-content:flex-start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>[hidden]{display:none!important} body{margin:0} img{max-width:100%} a.btn{text-decoration:none;display:inline-block}</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow" data-i18n="eyebrow"></div>
      <h1 data-i18n="h1"></h1>
      <p class="sub" data-i18n="sub"></p>
    </div>
    <div class="header-actions">
      <div class="lang" role="group" aria-label="Language / Idioma">
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
        <button type="button" data-lang="es" aria-pressed="false">ES</button>
      </div>
      <button id="icsBtn" type="button" data-i18n="calBtn"></button>
    </div>
  </header>

  <section id="calPanel" class="panel" hidden>
    <div class="panel-head">
      <h2 data-i18n="calTitle"></h2>
      <button type="button" class="ghost" id="calClose" data-i18n="close"></button>
    </div>
    <p class="sub" style="margin:0" data-i18n="calIntro"></p>
    <ul class="upcoming" id="calList"></ul>
    <div class="form-actions" style="display:flex">
      <button type="button" class="primary" id="icsDownload" data-i18n="icsAll"></button>
    </div>
  </section>

  <div id="offline" class="banner" hidden data-i18n="offline"></div>

  <section class="panel">
    <div class="panel-head">
      <h2 data-i18n="comingUp"></h2>
      <span class="eyebrow" data-i18n="allDogs"></span>
    </div>
    <div class="groups" id="upcoming"></div>
  </section>

  <nav class="tabs" id="tabs" aria-label="Dogs"></nav>
  <div class="profile" id="profile" hidden>
    <div class="avatar" id="avatar"></div>
    <div class="profile-text">
      <h2 id="dogName"></h2>
      <div class="dogline" id="dogline"></div>
    </div>
  </div>

  <section class="panel" id="doseForm" hidden>
    <h2 id="doseFormTitle"></h2>
    <div>
      <div class="eyebrow" style="margin-bottom:6px" data-i18n="commonSchedules"></div>
      <div class="presets" id="presets"></div>
    </div>
    <form class="grid" id="doseF">
      <label><span data-i18n="type"></span>
        <select id="fKind"><option value="vaccine" data-i18n="vaccine"></option><option value="parasite" data-i18n="parasite"></option></select>
      </label>
      <label><span data-i18n="name"></span><input id="fName" required data-i18n-ph="namePh"></label>
      <label><span data-i18n="product"></span><input id="fProduct" data-i18n-ph="productPh"></label>
      <label><span data-i18n="dateGiven"></span><input id="fGiven" type="date" required></label>
      <label><span data-i18n="repeat"></span>
        <select id="fEvery">
          <option value="30" data-i18n="opt30"></option><option value="90" data-i18n="opt90"></option><option value="84" data-i18n="opt84"></option>
          <option value="180" data-i18n="opt180"></option><option value="365" selected data-i18n="opt365"></option><option value="1095" data-i18n="opt1095"></option>
          <option value="0" data-i18n="opt0"></option>
        </select>
      </label>
      <label><span data-i18n="nextOverride"></span><input id="fDue" type="date"></label>
      <label class="full"><span data-i18n="notes"></span><input id="fNotes" data-i18n-ph="notesPh"></label>
      <div class="form-actions">
        <button type="button" id="fCancel" data-i18n="cancel"></button>
        <button class="primary" type="submit" data-i18n="save"></button>
      </div>
    </form>
  </section>

  <section class="panel">
    <div class="panel-head"><h2 data-i18n="vaccines"></h2><button type="button" class="primary" data-add="vaccine" data-i18n="recordVaccine"></button></div>
    <div class="table-wrap" id="vaccines"></div>
  </section>

  <section class="panel">
    <div class="panel-head"><h2 data-i18n="parasites"></h2><button type="button" class="primary" data-add="parasite" data-i18n="recordDose"></button></div>
    <div class="table-wrap" id="parasites"></div>
  </section>

  <div class="code-backdrop" id="codeDlg" hidden>
    <form class="code-box panel" id="codeF" role="dialog" aria-modal="true" aria-labelledby="codeTitle">
      <h2 id="codeTitle" data-i18n="codeTitle"></h2>
      <p class="sub" id="codeWhat" style="margin:0"></p>
      <label><span data-i18n="codeLabel"></span><input id="codeInput" type="password" autocomplete="off" required></label>
      <p class="code-err" id="codeErr" role="alert" hidden data-i18n="codeWrong"></p>
      <div class="form-actions" style="display:flex">
        <button type="button" id="codeCancel" data-i18n="cancel"></button>
        <button type="submit" class="primary" data-i18n="codeConfirm"></button>
      </div>
    </form>
  </div>

  <p class="status" id="status" role="status"></p>
  <p class="foot" data-i18n="foot"></p>
</div>

    gcalNA:"Google Calendar no está disponible en esta vista. Usa el archivo de calendario.",
    err:{server_not_connected:"Google Calendar no está conectado. Agrégalo en claude.ai Configuración → Conectores y vuelve a intentar.",

    evSummary:(d,n)=>`${d}: toca ${n}`, lastGiven:d=>`Última dosis ${d}`, firstDose:"Primera dosis", fromCard:"De la Cartilla de salud.",
    reminder:"Recordatorio", exportFirst:"Primero registra una dosis que se repita.", exportNA:"La exportación de calendario no está disponible en esta vista.",
    exportOk:"Archivo listo. Ábrelo para agregar los recordatorios.", exportCancel:"Exportación cancelada.", exportFail:"Esta vista no puede guardar el archivo. Pídele a Claude que agregue los recordatorios.",

    codeTitle:"Ingresa el código", codeLabel:"Código", codeWrong:"El código no es correcto. Intenta de nuevo.", codeConfirm:"Confirmar", codeWhat:(dog,n)=>`Registrar ${n} de ${dog} como aplicada hoy.`, codeSave:(dog,n)=>`Guardar ${n} de ${dog}.`
  }
};
/* stored names stay in English; shown in the chosen language */
const NAMES_ES = {
  "Rabies":"Rabia", "DHPP / Quíntuple":"Quíntuple (DHPP)", "DHPP / Séxtuple":"Séxtuple (DHPP)", "Leptospirosis":"Leptospirosis",
  "Bordetella (kennel cough)":"Bordetella (tos de las perreras)", "Canine influenza":"Influenza canina", "Giardia":"Giardia",
  "Internal deworming":"Desparasitación interna", "External deworming":"Desparasitación externa",
  "Flea, tick, heartworm & deworming":"Pulgas, garrapatas, gusano del corazón y desparasitación",
  "Flea & tick (monthly)":"Pulgas y garrapatas (mensual)", "Flea & tick (Bravecto)":"Pulgas y garrapatas (Bravecto)",
  "Heartworm prevention":"Prevención del gusano del corazón", "Intranasal":"Intranasal"
};
const NAMES_EN = Object.fromEntries(Object.entries(NAMES_ES).map(([k,v])=>[v.toLowerCase(),k]));
let lang = "en";
try{ lang = localStorage.getItem("lang") || ((navigator.language||"").toLowerCase().startsWith("es")?"es":"en"); }catch(_){ lang=(navigator.language||"").toLowerCase().startsWith("es")?"es":"en"; }
const T = () => STR[lang];
const BREED_ES = {"mixed breed":"Mestizo","mixed breed (f)":"Mestiza","female":"Hembra","male":"Macho","spayed":"esterilizada","neutered":"castrado","australian shepherd":"Pastor australiano"};
const trBreed = b => lang==="es" ? b.split(" · ").map(p=>BREED_ES[p.trim().toLowerCase()] || p.replace(/\blb\b/,"lb")).join(" · ") : b.replace(/\s*\(f\)/i,"");
const tn = n => (lang==="es" && NAMES_ES[n]) || n || "";
const canon = n => NAMES_EN[(n||"").trim().toLowerCase()] || (n||"").trim();
function applyStatic(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.textContent = T()[el.dataset.i18n]; });
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>{ el.placeholder = T()[el.dataset.i18nPh]; });
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.lang===lang)));
  $("#presets").innerHTML = PRESETS.map((p,i)=>`<button type="button" class="chip" data-preset="${i}">${esc(tn(p.name))}</button>`).join("");
  if(!$("#doseForm").hidden) $("#doseFormTitle").textContent = editingDose ? T().editDoseTitle(tn(editingDose.name)) : T().recordDoseTitle;
}

const PRESETS = [
  {kind:"vaccine", name:"Rabies", every:365},
  {kind:"vaccine", name:"DHPP / Quíntuple", every:365},
  {kind:"vaccine", name:"Leptospirosis", every:365},
  {kind:"vaccine", name:"Bordetella (kennel cough)", every:365},
  {kind:"vaccine", name:"Canine influenza", every:365},
  {kind:"parasite", name:"Flea, tick, heartworm & deworming", every:30},
  {kind:"parasite", name:"Internal deworming", every:90},
  {kind:"parasite", name:"Flea & tick (Bravecto)", every:84},
];
let dogs=[], doses=[], currentDog=null, editingDose=null, editingDog=null;

const todayISO = () => { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const parse = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const addDays = (s,n) => { const d=parse(s); d.setDate(d.getDate()+n); return iso(d); };
const daysBetween = (a,b) => Math.round((parse(b)-parse(a))/86400000);
const fmt = s => s ? parse(s).toLocaleDateString(lang==="es"?"es-MX":"en-US",{day:"numeric",month:"short",year:"numeric"}) : "—";
const dogColor = id => { const i=dogs.findIndex(d=>d.id===id); const c=dogs[i]?.color; return `var(--dog-${(Number.isInteger(c)?c:Math.max(0,i))%5})`; };
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const everyLabel = n => T().every[n] || T().everyN(n);
const kindLabel = k => k==="vaccine" ? T().vaccine : T().parasite;
const setStatus = t => { $("#status").textContent=t; if(t) setTimeout(()=>{ if($("#status").textContent===t) $("#status").textContent=""; },4000); };

function nextDue(d){ if(d.dueOverride) return d.dueOverride; if(!d.given) return null; return d.every>0 ? addDays(d.given,d.every) : null; }
const givenBtn = (s,label) => {
  const n = daysBetween(todayISO(), s.due);
  return n>7
    ? `<button type="button" disabled title="${esc(T().opensIn7)}">${label}</button>`
    : `<button type="button" data-given="${s.latest.id}">${label}</button>`;
};
const months = d => Math.round(d/30.44);
function statusOf(due){
  const t=T();
  if(!due) return {cls:"s-once",label:t.done};
  const n = daysBetween(todayISO(),due);
  if(n< -60) return {cls:"s-overdue",label:t.monthsOverdue(months(-n)),n};
  if(n<0) return {cls:"s-overdue",label:t.daysOverdue(-n),n};
  if(n===0) return {cls:"s-overdue",label:t.dueToday,n};
  if(n<=7) return {cls:"s-soon",label:t.dueIn(n),n};
  if(n<=30) return {cls:"s-ok",label:t.dueIn(n),n};
  if(n>60) return {cls:"s-ok",label:t.inMonths(months(n)),n};
  return {cls:"s-ok",label:t.inDays(n),n};
}
/* one schedule per dog + name; latest dose drives it */
function schedules(dogId){
  const g={};
  doses.filter(d=>d.dogId===dogId).forEach(d=>{
    const k=d.kind+"|"+canon(d.name).toLowerCase();
    (g[k] ||= []).push(d);
  });
  return Object.values(g).map(list=>{
    list.sort((a,b)=>(b.given||"9999").localeCompare(a.given||"9999"));
    const latest=list[0]; const due=nextDue(latest);
    return {latest, history:list, due, st:statusOf(due)};
  });
}

function render(){
  const t=T();
  if(currentDog && !dogs.find(d=>d.id===currentDog)) currentDog=null;
  if(!currentDog && dogs.length) currentDog=dogs[0].id;
  $("#tabs").innerHTML = dogs.map(d=>`<button type="button" class="tab" role="tab" aria-selected="${d.id===currentDog}" data-dog="${d.id}"><span class="swatch" style="background:${dogColor(d.id)}"></span>${esc(d.name)}</button>`).join("");
  const dog=dogs.find(d=>d.id===currentDog);
  $("#profile").hidden = !dog;
  if(dog){
    $("#dogName").textContent = dog.name;
    const av=$("#avatar"); av.textContent="";
    if(dog.photo){ const img=new Image(); img.src=dog.photo; img.alt=dog.name; av.appendChild(img); }
    else av.textContent=(dog.name||"?").slice(0,1).toUpperCase();
  }
  $("#dogline").innerHTML = dog ? [
    dog.breed && `<span>${esc(trBreed(dog.breed))}</span>`,
    dog.weight && `<span>${esc(dog.weight)}</span>`,
    dog.birth && `<span>${esc(t.born(fmt(dog.birth)))}</span>`,
    dog.vet && `<span>${esc(t.vet(dog.vet))}</span>`,
  ].filter(Boolean).join("") : "";
  document.querySelectorAll("[data-add]").forEach(b=>b.disabled=!dog);

  // upcoming across all dogs
  const groups={overdue:[],week:[],month:[]};
  dogs.forEach(dg=>schedules(dg.id).forEach(s=>{
    if(!s.due) return;
    const n=daysBetween(todayISO(),s.due);
    if(n<0) groups.overdue.push({...s,dog:dg});
    else if(n<=7) groups.week.push({...s,dog:dg});
    else if(n<=30) groups.month.push({...s,dog:dg});
  }));
  Object.values(groups).forEach(g=>g.sort((a,b)=>a.due.localeCompare(b.due)));
  const item = s=>`<li>
        <span class="date">${fmt(s.due)}</span>
        <div class="what"><b>${esc(tn(s.latest.name))}</b><span><b class="dogname" style="color:${dogColor(s.dog.id)}">${esc(s.dog.name)}</b> · ${kindLabel(s.latest.kind)}${s.latest.product?" · "+esc(tn(s.latest.product)):""}</span></div>
        <div class="row-actions"><span class="pill ${s.st.cls}">${s.st.label}</span>${givenBtn(s,t.markGiven)}</div>
      </li>`;
  const block = (title, cls, list, none) => `<div class="group">
      <h3 class="group-head"><span class="dot ${cls}"></span>${title}<span class="count">${list.length}</span></h3>
      <ul class="upcoming">${list.length ? list.map(item).join("") : `<li class="empty" style="display:block">${none}</li>`}</ul>
    </div>`;
  $("#upcoming").innerHTML = !dogs.length
    ? `<p class="empty">${t.emptyAll}</p>`
    : block(t.overdue,"s-overdue",groups.overdue,t.noneOverdue)
      + block(t.next7,"s-soon",groups.week,t.noneWeek)
      + block(t.next30,"s-ok",groups.month,t.noneMonth);

  const tbl = kind => {
    if(!dog) return `<p class="empty">${t.addDogStart}</p>`;
    const rows=schedules(dog.id).filter(s=>s.latest.kind===kind).sort((a,b)=>(a.due||"9999").localeCompare(b.due||"9999"));
    if(!rows.length) return `<p class="empty">${esc(t.noneRecorded(kind,dog.name))}</p>`;
    return `<table><thead><tr><th>${t.thName}</th><th>${t.thLast}</th><th>${t.thSched}</th><th>${t.thNext}</th><th></th></tr></thead><tbody>${
      rows.map(s=>`<tr>
        <td><b>${esc(tn(s.latest.name))}</b>${s.latest.product?`<div class="note">${esc(tn(s.latest.product))}</div>`:""}${s.latest.notes?`<div class="note">${esc(s.latest.notes)}</div>`:""}
          ${s.history.length>1?`<details class="hist"><summary>${t.dosesOnRecord(s.history.length)}</summary><ul>${s.history.map(h=>`<li><span class="mono">${h.given?fmt(h.given):t.planned}</span>${h.product?" · "+esc(tn(h.product)):""} <button type="button" class="ghost" data-edit="${h.id}">${t.editLower}</button></li>`).join("")}</ul></details>`:""}</td>
        <td class="date">${s.latest.given?fmt(s.latest.given):t.notGiven}</td>
        <td>${everyLabel(s.latest.every)}</td>
        <td><div class="date">${fmt(s.due)}</div><span class="pill ${s.st.cls}">${s.st.label}</span></td>
        <td><div class="row-actions">${s.due?givenBtn(s,t.givenToday):""}<button type="button" class="ghost" data-edit="${s.latest.id}">${t.edit}</button></div></td>
      </tr>`).join("")}</tbody></table>`;
  };
  if(!$("#calPanel").hidden) renderCal();
  $("#vaccines").innerHTML=tbl("vaccine");
  $("#parasites").innerHTML=tbl("parasite");
}

/* ---------- forms ---------- */
function openDose(kind, dose){
  editingDose = dose || null;
  $("#doseFormTitle").textContent = dose ? T().editDoseTitle(tn(dose.name)) : T().recordDoseTitle;
  $("#fKind").value = dose?.kind || kind;
  $("#fName").value = dose ? tn(dose.name) : "";
  $("#fProduct").value = dose?.product || "";
  $("#fGiven").value = dose?.given || todayISO();
  $("#fEvery").value = String(dose?.every ?? (kind==="parasite"?30:365));
  if(!$("#fEvery").value){ const o=new Option(everyLabel(dose.every),dose.every); $("#fEvery").add(o); $("#fEvery").value=String(dose.every); }
  $("#fDue").value = dose?.dueOverride || "";
  $("#fNotes").value = dose?.notes || "";
  $("#doseForm").hidden=false; $("#doseForm").scrollIntoView({behavior:"smooth",block:"start"}); $("#fName").focus();
}
document.addEventListener("click", async e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.dataset.lang){ lang=t.dataset.lang; try{ localStorage.setItem("lang",lang); }catch(_){} applyStatic(); render(); }
  else if(t.dataset.dog){ currentDog=t.dataset.dog; render(); }
  else if(t.dataset.add) openDose(t.dataset.add);
  else if(t.dataset.preset){ const p=PRESETS[t.dataset.preset]; $("#fKind").value=p.kind; $("#fName").value=tn(p.name); $("#fEvery").value=String(p.every); }
  else if(t.dataset.edit) openDose(null, doses.find(d=>d.id===t.dataset.edit));
  else if(t.id==="codeCancel") closeCode();
  else if(t.dataset.given){
    const d=doses.find(x=>x.id===t.dataset.given); if(!d) return;
    const dog=dogs.find(x=>x.id===d.dogId);
    askCode(T().codeWhat(dog?dog.name:"", tn(d.name)), code=>rpc("pc_mark_given",{p_code:code,p_dose_id:d.id}), T().recorded(tn(d.name)));
  }
  else if(t.id==="fCancel") $("#doseForm").hidden=true;
  else if(t.id==="icsBtn") openCal();
  else if(t.id==="calClose") $("#calPanel").hidden=true;
  else if(t.id==="icsDownload") exportICS();
});

$("#doseF").addEventListener("submit", e=>{
  e.preventDefault();
  const editing=editingDose, dogId=editing?editing.dogId:currentDog, dog=dogs.find(x=>x.id===dogId);
  const args={
    p_id: editing?editing.id:null, p_dog_id: dogId, p_kind: $("#fKind").value,
    p_name: canon($("#fName").value), p_product: canon($("#fProduct").value),
    p_given: $("#fGiven").value||null, p_every: Number($("#fEvery").value),
    p_due_override: $("#fDue").value||null, p_notes: $("#fNotes").value.trim()
  };
  askCode(T().codeSave(dog?dog.name:"", tn(args.p_name)), code=>rpc("pc_save_dose",{p_code:code,...args}), T().saved, ()=>{ $("#doseForm").hidden=true; });
});

/* ---------- code dialog: the server checks the code on every save ---------- */
let pending=null;
function askCode(msg, action, okMsg, after){
  pending={action, okMsg, after};
  $("#codeWhat").textContent=msg;
  $("#codeInput").value=""; $("#codeErr").hidden=true; $("#codeErr").textContent=T().codeWrong;
  $("#codeDlg").hidden=false; $("#codeInput").focus();
}
function closeCode(){ pending=null; $("#codeDlg").hidden=true; }
$("#codeF").addEventListener("submit", async e=>{
  e.preventDefault();
  if(!pending) return;
  const btn=$("#codeF").querySelector('[type="submit"]'); btn.disabled=true;
  try{
    await pending.action($("#codeInput").value.trim());
    const p=pending; closeCode();
    if(p.after) p.after();
    setStatus(p.okMsg);
    await load();
  }catch(err){
    $("#codeErr").textContent = err.code==="bad_code" ? T().codeWrong : T().saveFail;
    $("#codeErr").hidden=false; $("#codeInput").select();
  }finally{ btn.disabled=false; }
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && !$("#codeDlg").hidden) closeCode(); });
$("#codeDlg").addEventListener("click", e=>{ if(e.target.id==="codeDlg") closeCode(); });

/* ---------- calendar ---------- */
function calItems(){
  const out=[];
  dogs.forEach(dg=>schedules(dg.id).forEach(s=>{ if(s.due && daysBetween(todayISO(),s.due)>=0) out.push({...s,dog:dg}); }));
  return out.sort((a,b)=>a.due.localeCompare(b.due));
}
function evText(s, dogName){
  const t=T();
  return {
    summary: t.evSummary(dogName, tn(s.latest.name)),
    description: `${kindLabel(s.latest.kind)}${s.latest.product?" – "+tn(s.latest.product):""}. ${s.latest.given?t.lastGiven(fmt(s.latest.given)):t.firstDose}. ${t.fromCard}`
  };
}
function gcalLink(s){
  const tx=evText(s, s.dog.name);
  const q=new URLSearchParams({action:"TEMPLATE", text:tx.summary, details:tx.description+"\n"+location.href,
    dates:`${s.due.replace(/-/g,"")}/${addDays(s.due,1).replace(/-/g,"")}`});
  return "https://calendar.google.com/calendar/render?"+q.toString();
}
function renderCal(){
  const t=T(), items=calItems();
  $("#calList").innerHTML = items.length ? items.map(s=>`<li>
      <span class="date">${fmt(s.due)}</span>
      <div class="what"><b><span class="dogname" style="color:${dogColor(s.dog.id)}">${esc(s.dog.name)}</span>: ${esc(tn(s.latest.name))}</b><span>${kindLabel(s.latest.kind)}${s.latest.product?" · "+esc(tn(s.latest.product)):""}</span></div>
      <div class="row-actions"><a class="btn" href="${esc(gcalLink(s))}" target="_blank" rel="noopener">${t.addToGcal}</a></div>
    </li>`).join("") : `<li class="empty" style="display:block">${t.noUpcoming}</li>`;
  $("#icsDownload").disabled=!items.length;
}
function openCal(){ renderCal(); $("#calPanel").hidden=false; $("#calPanel").scrollIntoView({behavior:"smooth",block:"start"}); }
function exportICS(){
  const t=T(), ev=[]; const stamp=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";
  const icsEsc = v => v.replace(/[,;\\]/g,"\\$&").replace(/\n/g,"\\n");
  calItems().forEach(s=>{
    const start=s.due.replace(/-/g,""), end=addDays(s.due,1).replace(/-/g,""), tx=evText(s, s.dog.name);
    ev.push(["BEGIN:VEVENT",`UID:${s.latest.id}-${start}@perroscuerna`,`DTSTAMP:${stamp}`,`DTSTART;VALUE=DATE:${start}`,`DTEND;VALUE=DATE:${end}`,
      `SUMMARY:${icsEsc(tx.summary)}`, `DESCRIPTION:${icsEsc(tx.description)}`,
      "BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${t.reminder}`,"TRIGGER:-P7D","END:VALARM",
      "BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${t.reminder}`,"TRIGGER:-P1D","END:VALARM","END:VEVENT"].join("\r\n"));
  });
  if(!ev.length){ setStatus(t.exportFirst); return; }
  const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Perros Cuerna//ES","CALSCALE:GREGORIAN",...ev,"END:VCALENDAR"].join("\r\n");
  const url=URL.createObjectURL(new Blob([ics],{type:"text/calendar"}));
  const a=document.createElement("a"); a.href=url; a.download="perros-cuerna.ics"; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
  setStatus(t.exportOk);
}

/* ---------- data (Supabase) ---------- */
const SB_URL="https://omletgvnkwgsjevuipfw.supabase.co";
const SB_KEY="sb_publishable_8VAHf9T_5R9MPBwjiwg4Hg_FdTuqCd2";
const SB_HEADERS={apikey:SB_KEY, "Content-Type":"application/json"};
async function get(path){
  const r=await fetch(`${SB_URL}/rest/v1/${path}`,{headers:SB_HEADERS});
  if(!r.ok) throw new Error("load_failed");
  return r.json();
}
async function rpc(fn, args){
  const r=await fetch(`${SB_URL}/rest/v1/rpc/${fn}`,{method:"POST",headers:SB_HEADERS,body:JSON.stringify(args)});
  if(!r.ok){
    let body={}; try{ body=await r.json(); }catch(_){}
    const err=new Error(body.message||"save_failed");
    err.code = (body.message||"").includes("bad_code") ? "bad_code" : "save_failed";
    throw err;
  }
}
async function load(){
  try{
    const [dg, ds] = await Promise.all([get("pc_dogs?select=*&order=created_at"), get("pc_doses?select=*")]);
    dogs = dg;
    doses = ds.map(d=>({id:d.id, dogId:d.dog_id, kind:d.kind, name:d.name, product:d.product||"", given:d.given||"",
      every:d.every, dueOverride:d.due_override||"", notes:d.notes||"", createdAt:d.created_at}));
    $("#offline").hidden=true;
    render();
  }catch(err){ $("#offline").hidden=false; }
}

applyStatic();
render();
load();
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") load(); });
</script>
