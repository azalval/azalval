<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kompas — Google Play Store Downloads</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #fff; padding: 40px 32px; color: #111; }
.wrap { max-width: 800px; margin: 0 auto; }
.title { font-size: 22px; font-weight: 700; color: #0f2a52; margin-bottom: 24px; }
.metrics { display: flex; gap: 32px; margin-bottom: 24px; flex-wrap: wrap; }
.metric { display: flex; flex-direction: column; gap: 4px; }
.metric-label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #6b7280; }
.metric-value { font-size: 26px; font-weight: 700; color: #111; }
.legend { font-size: 12px; color: #6b7280; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
.legend-line { display: inline-block; width: 24px; height: 2px; background: #1D9E75; }
.chart-wrap { position: relative; width: 100%; height: 320px; }
.chart-footer { font-size: 11px; color: #9ca3af; margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="title">Google Play Store downloads</div>

  <div class="metrics">
    <div class="metric"><span class="metric-label">Peak daily users</span><span class="metric-value">8,000</span></div>
    <div class="metric"><span class="metric-label">Peak year</span><span class="metric-value">2020</span></div>
    <div class="metric"><span class="metric-label">By 2023</span><span class="metric-value">&lt; 500</span></div>
  </div>

  <div class="legend"><span class="legend-line"></span> unique downloads</div>

  <div class="chart-wrap">
    <canvas id="dlChart" role="img" aria-label="Line chart showing Kompas Google Play daily downloads from 2019 to 2023. Near zero until mid-2020, spiked to ~8000 with two peaks in late 2020, then steadily declined to under 500 by 2023.">Daily downloads: near 0 in 2019, peaked ~8000 in late 2020, declined to ~500 by 2023.</canvas>
  </div>

  <div class="chart-footer">Source · Google Play Store</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const labels = [
  'May 19','Jun 19','Jul 19','Aug 19','Sep 19','Oct 19','Nov 19','Dec 19',
  'Jan 20','Feb 20','Mar 20','Apr 20','May 20','Jun 20','Jul 20','Aug 20',
  'Sep 20','Oct 20','Nov 20','Dec 20',
  'Jan 21','Feb 21','Mar 21','Apr 21','May 21','Jun 21','Jul 21','Aug 21',
  'Sep 21','Oct 21','Nov 21','Dec 21',
  'Jan 22','Feb 22','Mar 22','Apr 22','May 22','Jun 22','Jul 22','Aug 22',
  'Sep 22','Oct 22','Nov 22','Dec 22',
  'Jan 23','Feb 23','Mar 23','Apr 23','May 23','Jun 23'
];
const data = [
  10,15,20,30,40,60,80,120,
  200,350,600,1200,2800,4200,5800,6800,
  7400,7700,7900,6200,
  7300,7600,7000,6200,5500,4900,4400,4000,
  3700,3500,3300,3100,
  2900,2700,2500,2300,2100,1900,1700,1550,
  1400,1300,1200,1100,
  1050,1020,1000,1000,1000,1000
];

new Chart(document.getElementById('dlChart'), {
  type: 'line',
  data: {
    labels,
    datasets: [{
      data,
      borderColor: '#1D9E75',
      borderWidth: 2.5,
      pointRadius: 0,
      tension: 0.4,
      fill: true,
      backgroundColor: 'rgba(29,158,117,0.07)'
    }]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { display: false },
      tooltip: {
        callbacks: { label: ctx => ctx.parsed.y.toLocaleString() + ' usuarios' }
      }
    },
    scales: {
      x: {
        ticks: { autoSkip: true, maxTicksLimit: 6, color: '#9ca3af', font: { size: 11 } },
        grid: { display: false },
        border: { color: '#e5e7eb' }
      },
      y: {
        min: 0, max: 8500,
        ticks: {
          stepSize: 2000, color: '#9ca3af', font: { size: 11 },
          callback: v => v === 0 ? '0' : (v/1000).toFixed(0) + '.000'
        },
        grid: { color: 'rgba(0,0,0,.06)' },
        border: { display: false }
      }
    }
  }
});
</script>
</body>
</html>
